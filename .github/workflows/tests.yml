name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Model calls are mocked, so MLX and model downloads are not required.
      - name: Run unit tests
        run: python test_tools.py -v

      - name: Check Python syntax
        run: python -m compileall -q agent.py core.py mcp_server.py test_tools.py eval_*.py
